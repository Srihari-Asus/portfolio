<!-- 
  SRIHARI S. - PORTRAIT PLACEHOLDER
  To replace with your actual portrait photo:
  1. Save your photograph (e.g. portrait.jpg or portrait.png) into public/assets/profile/
  2. Update the image reference in src/components/Hero.tsx and src/components/About.tsx
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" fill="none">
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff1f2d" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#96000a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191924"/>
      <stop offset="50%" stop-color="#0f0f15"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="rimRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a38"/>
      <stop offset="50%" stop-color="#e50914" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22222d" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="600" height="750" fill="#07070a"/>
  <circle cx="300" cy="280" r="280" fill="url(#redGlow)"/>
  <rect width="600" height="750" fill="url(#gridPattern)"/>

  <!-- Tech HUD Circles -->
  <circle cx="300" cy="300" r="220" stroke="#e50914" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="8 12"/>
  <circle cx="300" cy="300" r="250" stroke="#48484a" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="300" cy="300" r="280" stroke="#e50914" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="2 18"/>

  <!-- Silhouette Geometry: Head and Shoulders with Cinematic Lighting -->
  <!-- Shoulders / Torso -->
  <path d="M120 750 C120 620, 180 540, 240 500 C270 480, 330 480, 360 500 C420 540, 480 620, 480 750 Z" fill="url(#bodyGrad)" stroke="url(#rimRed)" stroke-width="2"/>
  
  <!-- Neck -->
  <path d="M265 480 L265 390 C265 385, 335 385, 335 390 L335 480 Z" fill="#12121a" stroke="#e50914" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Head Contour -->
  <path d="M240 280 C240 180, 260 140, 300 140 C340 140, 360 180, 360 280 C360 360, 340 400, 300 400 C260 400, 240 360, 240 280 Z" fill="#0d0d14"/>

  <!-- Rim light overlay (Left highlight) -->
  <path d="M240 280 C240 180, 260 140, 300 140 C280 160, 255 210, 255 280 C255 350, 280 390, 300 400 C260 400, 240 360, 240 280 Z" fill="#e50914" opacity="0.65"/>
  
  <!-- Cybernetic / Architectural Grid Overlay on Face -->
  <path d="M275 220 L325 220" stroke="#ff2a38" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M300 210 L300 330" stroke="#ff2a38" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <circle cx="300" cy="220" r="3" fill="#ff2a38"/>
  <circle cx="280" cy="260" r="2" fill="#e50914"/>
  <circle cx="320" cy="260" r="2" fill="#e50914"/>

  <!-- Collar / Cyber Accents -->
  <path d="M240 500 L270 550 L300 580 L330 550 L360 500" stroke="#ff2a38" stroke-width="1.5" stroke-opacity="0.7" fill="none"/>
  
  <!-- Modern Editorial Label Overlay -->
  <rect x="50" y="660" width="220" height="34" rx="4" fill="#0b0b10" stroke="#22222d"/>
  <text x="65" y="682" fill="#d1d1d6" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2">SRIHARI S. // DEV</text>
  <circle cx="250" cy="677" r="4" fill="#e50914"/>

  <rect x="420" y="80" width="130" height="28" rx="2" fill="rgba(11,11,16,0.8)" stroke="#e50914" stroke-opacity="0.4"/>
  <text x="432" y="98" fill="#ff2a38" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.5">SYS.ONLINE</text>
</svg>
