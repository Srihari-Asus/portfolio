<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="agGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff1f2d" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#96000a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141c"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a38"/>
      <stop offset="50%" stop-color="#96000a"/>
      <stop offset="100%" stop-color="#191924"/>
    </linearGradient>
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2a2a38" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#07070a"/>
  <rect width="800" height="500" fill="url(#dotGrid)"/>
  <circle cx="360" cy="240" r="300" fill="url(#agGlow)"/>

  <!-- Top UI Header Bar -->
  <rect x="40" y="30" width="720" height="44" rx="6" fill="#0f0f16" stroke="#22222d"/>
  <circle cx="65" cy="52" r="5" fill="#ff2a38"/>
  <circle cx="85" cy="52" r="5" fill="#48484a"/>
  <circle cx="105" cy="52" r="5" fill="#22222d"/>
  <text x="135" y="56" fill="#d1d1d6" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">AGROPLAY.AI // CONTEXT-AWARE AGRI INTEL ENGINE</text>
  <rect x="620" y="42" width="120" height="20" rx="3" fill="#1e1416" stroke="#e50914" stroke-opacity="0.4"/>
  <text x="635" y="56" fill="#ff2a38" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">GEMINI VISION LIVE</text>

  <!-- Main Left Card: Plant Disease Diagnostic HUD -->
  <rect x="40" y="95" width="440" height="365" rx="10" fill="#0d0d14" stroke="#232332"/>
  
  <!-- Neural Leaf / Biometric Visual -->
  <path d="M 260 130 C 340 160, 360 250, 300 320 C 240 390, 180 370, 160 310 C 140 240, 190 140, 260 130 Z" fill="url(#leafGrad)" stroke="#ff2a38" stroke-width="1.5" opacity="0.75"/>
  <path d="M 260 130 Q 240 250 210 350" stroke="#ff858d" stroke-width="2" stroke-linecap="round"/>
  <!-- Leaf veins / neural lines -->
  <path d="M 250 200 Q 300 190 325 210" stroke="#ff2a38" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M 235 240 Q 180 230 165 260" stroke="#ff2a38" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M 225 280 Q 285 270 305 300" stroke="#ff2a38" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Scanning Reticle over Disease Region -->
  <rect x="260" y="190" width="85" height="75" rx="4" fill="rgba(229,9,20,0.1)" stroke="#ff2a38" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="270" y="210" fill="#ff3b47" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">INFECT.DETECT</text>
  <text x="270" y="225" fill="#f5f5f7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">97.4% CONF</text>
  <text x="270" y="240" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="9">Cercospora Spot</text>

  <!-- Overlay HUD telemetry -->
  <g transform="translate(60, 390)">
    <rect width="180" height="50" rx="6" fill="#14141c" stroke="#262635"/>
    <text x="14" y="22" fill="#8e8e93" font-family="'JetBrains Mono', monospace" font-size="10">REMEDIATION PROTOCOL</text>
    <text x="14" y="38" fill="#f5f5f7" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Bio-copper Spray @ 2.5g/L</text>
  </g>

  <!-- Right Stack: Crop Planning & Market Intelligence -->
  <!-- Box 1: Crop Context Plan -->
  <rect x="500" y="95" width="260" height="175" rx="10" fill="#0d0d14" stroke="#232332"/>
  <text x="520" y="125" fill="#8e8e93" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">SOIL &amp; CLIMATE ENGINE</text>
  <text x="520" y="150" fill="#f5f5f7" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Optimal Sowing Window</text>
  <rect x="520" y="165" width="220" height="6" rx="3" fill="#1f1f2a"/>
  <rect x="520" y="165" width="165" height="6" rx="3" fill="#e50914"/>
  <text x="520" y="195" fill="#d1d1d6" font-family="'JetBrains Mono', monospace" font-size="11">Moisture: 68% • pH: 6.4</text>
  <text x="520" y="215" fill="#d1d1d6" font-family="'JetBrains Mono', monospace" font-size="11">Recommendation: Hybrid Maize</text>
  <rect x="520" y="235" width="110" height="22" rx="3" fill="rgba(229,9,20,0.15)" stroke="#e50914" stroke-opacity="0.5"/>
  <text x="532" y="250" fill="#ff3b47" font-family="'JetBrains Mono', monospace" font-size="10">HIGH YIELD (+22%)</text>

  <!-- Box 2: Market Intelligence Mandi Forecast -->
  <rect x="500" y="285" width="260" height="175" rx="10" fill="#0d0d14" stroke="#232332"/>
  <text x="520" y="315" fill="#8e8e93" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">MARKET INTELLIGENCE</text>
  <text x="520" y="340" fill="#f5f5f7" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Mandi Price Index</text>
  <!-- Mini Bar Chart -->
  <g transform="translate(520, 360)">
    <rect x="0" y="45" width="25" height="25" rx="2" fill="#22222d"/>
    <rect x="35" y="30" width="25" height="40" rx="2" fill="#301518"/>
    <rect x="70" y="20" width="25" height="50" rx="2" fill="#63141a"/>
    <rect x="105" y="10" width="25" height="60" rx="2" fill="#a40e16"/>
    <rect x="140" y="0" width="25" height="70" rx="2" fill="#ff1f2d"/>
    <text x="175" y="45" fill="#f5f5f7" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">₹2,840</text>
    <text x="175" y="62" fill="#ff3b47" font-family="'JetBrains Mono', monospace" font-size="10">+14.2% WK</text>
  </g>
</svg>
