      <stop offset="100%" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="diagGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 24 L 24 0 M 0 0 L 24 24" fill="none" stroke="#1a1a24" stroke-width="0.5"/>
