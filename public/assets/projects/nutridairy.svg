  <ellipse cx="230" cy="210" rx="60" ry="40" fill="#402810" opacity="0.85"/>
  <ellipse cx="330" cy="170" rx="55" ry="35" fill="#251a10" opacity="0.9"/>
  <ellipse cx="280" cy="240" rx="40" ry="28" fill="#3a2512" opacity="0.8"/>

