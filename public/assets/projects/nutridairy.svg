  <rect x="530" y="170" width="210" height="50" rx="4" fill="#14141c" stroke="#22222d"/>
  <text x="542" y="190" fill="#ff3b47" font-family="'JetBrains Mono', monospace" font-size="10">ROLE-BASED AUTH</text>
  <text x="542" y="208" fill="#d1d1d6" font-family="'Space Grotesk', sans-serif" font-size="12">Spring Security JWT Guard</text>

  <rect x="530" y="230" width="210" height="50" rx="4" fill="#14141c" stroke="#22222d"/>
