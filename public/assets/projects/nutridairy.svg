  <text x="542" y="395" fill="#f5f5f7" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Threshold Monitoring</text>
  <text x="542" y="415" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="10">Push Notification on Temp &gt; 35°C</text>
  <text x="542" y="430" fill="#30d158" font-family="'JetBrains Mono', monospace" font-size="10">System Status: NOMINAL</text>
