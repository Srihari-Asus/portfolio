<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="sbGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff1f2d" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#96000a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e1e2c" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#07070a"/>
  <rect width="800" height="500" fill="url(#dotPattern)"/>
  <circle cx="400" cy="250" r="300" fill="url(#sbGlow)"/>

  <!-- Top Bar -->
  <rect x="40" y="30" width="720" height="44" rx="6" fill="#0f0f16" stroke="#22222d"/>
  <circle cx="65" cy="52" r="5" fill="#ff2a38"/>
  <text x="85" y="56" fill="#d1d1d6" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">CUSTOMER SHOPPING BEHAVIOR // PREDICTIVE RETAIL INTELLIGENCE</text>
  <rect x="580" y="42" width="160" height="20" rx="3" fill="#1e1416" stroke="#e50914" stroke-opacity="0.4"/>
  <text x="590" y="56" fill="#ff3b47" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">PYTHON · SQL · POWER BI</text>

  <!-- Left: Demographic Segmentation & RFM Cluster Matrix -->
  <rect x="40" y="95" width="420" height="365" rx="8" fill="#0c0c12" stroke="#22222d"/>
  <text x="65" y="125" fill="#8e8e93" font-family="'JetBrains Mono', monospace" font-size="10">COHORT CLUSTERING &amp; RFM</text>
  <text x="65" y="150" fill="#f5f5f7" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Customer Persona Distribution</text>

  <!-- Interactive visual chart / donut or treemap -->
  <g transform="translate(65, 175)">
    <!-- Segment 1: Champions -->
    <rect x="0" y="0" width="190" height="120" rx="6" fill="#251216" stroke="#e50914" stroke-width="1.2"/>
    <text x="16" y="28" fill="#ff858d" font-family="'JetBrains Mono', monospace" font-size="10">TIER 1 // CHAMPIONS</text>
    <text x="16" y="60" fill="#fff" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">38.4%</text>
    <text x="16" y="82" fill="#d1d1d6" font-family="'JetBrains Mono', monospace" font-size="10">Avg Spend: ₹4,920</text>
    <text x="16" y="100" fill="#30d158" font-family="'JetBrains Mono', monospace" font-size="10">Freq: 8.2 trans/mo</text>

    <!-- Segment 2: Loyalists -->
    <rect x="205" y="0" width="175" height="120" rx="6" fill="#14141c" stroke="#262635"/>
    <text x="16" y="28" fill="#8e8e93" font-family="'JetBrains Mono', monospace" font-size="10">TIER 2 // LOYAL</text>
    <text x="16" y="60" fill="#f5f5f7" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">29.1%</text>
    <text x="16" y="82" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="10">Avg Spend: ₹2,850</text>
    <text x="16" y="100" fill="#ff9f0a" font-family="'JetBrains Mono', monospace" font-size="10">Freq: 4.1 trans/mo</text>

    <!-- Segment 3: At-Risk & New -->
    <rect x="0" y="135" width="380" height="110" rx="6" fill="#14141c" stroke="#262635"/>
    <text x="16" y="160" fill="#8e8e93" font-family="'JetBrains Mono', monospace" font-size="10">RETAIL RETENTION &amp; ATTRITION RISK</text>
    <!-- Bar comparison -->
    <text x="16" y="185" fill="#d1d1d6" font-family="'JetBrains Mono', monospace" font-size="10">New Customers: 18.2%</text>
    <rect x="160" y="174" width="200" height="12" rx="3" fill="#1f1f2d"/>
    <rect x="160" y="174" width="75" height="12" rx="3" fill="#30d158"/>

    <text x="16" y="215" fill="#d1d1d6" font-family="'JetBrains Mono', monospace" font-size="10">At-Risk Churn: 14.3%</text>
    <rect x="160" y="204" width="200" height="12" rx="3" fill="#1f1f2d"/>
    <rect x="160" y="204" width="58" height="12" rx="3" fill="#ff453a"/>
  </g>

  <!-- Right: Power BI Telemetry Metrics & Category Trends -->
  <rect x="480" y="95" width="280" height="365" rx="8" fill="#0c0c12" stroke="#22222d"/>
  <text x="500" y="125" fill="#8e8e93" font-family="'JetBrains Mono', monospace" font-size="10">POWER BI KPI METRICS</text>
  <text x="500" y="150" fill="#f5f5f7" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Category Affinity</text>

  <!-- Category Bars -->
  <g transform="translate(500, 175)">
    <text x="0" y="16" fill="#f5f5f7" font-family="'JetBrains Mono', monospace" font-size="11">Apparel &amp; Fashion</text>
    <text x="200" y="16" fill="#ff3b47" font-family="'JetBrains Mono', monospace" font-size="11">42%</text>
    <rect x="0" y="26" width="240" height="8" rx="4" fill="#1a1a26"/>
    <rect x="0" y="26" width="190" height="8" rx="4" fill="#e50914"/>

    <text x="0" y="60" fill="#f5f5f7" font-family="'JetBrains Mono', monospace" font-size="11">Consumer Electronics</text>
    <text x="200" y="60" fill="#ff3b47" font-family="'JetBrains Mono', monospace" font-size="11">28%</text>
    <rect x="0" y="70" width="240" height="8" rx="4" fill="#1a1a26"/>
    <rect x="0" y="70" width="130" height="8" rx="4" fill="#ff2a38"/>

    <text x="0" y="104" fill="#f5f5f7" font-family="'JetBrains Mono', monospace" font-size="11">Home &amp; Essentials</text>
    <text x="200" y="104" fill="#ff3b47" font-family="'JetBrains Mono', monospace" font-size="11">19%</text>
    <rect x="0" y="114" width="240" height="8" rx="4" fill="#1a1a26"/>
    <rect x="0" y="114" width="85" height="8" rx="4" fill="#800008"/>

    <text x="0" y="148" fill="#f5f5f7" font-family="'JetBrains Mono', monospace" font-size="11">Health &amp; Wellness</text>
    <text x="200" y="148" fill="#ff3b47" font-family="'JetBrains Mono', monospace" font-size="11">11%</text>
    <rect x="0" y="158" width="240" height="8" rx="4" fill="#1a1a26"/>
    <rect x="0" y="158" width="50" height="8" rx="4" fill="#48484a"/>
  </g>

  <!-- Key Insights card -->
  <rect x="500" y="360" width="240" height="80" rx="4" fill="#14141c" stroke="#22222d"/>
  <text x="512" y="385" fill="#8e8e93" font-family="'JetBrains Mono', monospace" font-size="9">STRATEGIC RECOMMENDATION</text>
  <text x="512" y="405" fill="#30d158" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">Cross-sell bundle lift: +18%</text>
  <text x="512" y="423" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="10">Target Tier 1 with automated loyalty perks</text>
</svg>
